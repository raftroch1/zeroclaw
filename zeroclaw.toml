# ZeroClaw Configuration
# This file configures the ZeroClaw agent runtime

[agent]
# Maximum tool-call loop turns per user message
# Set to very high value for local/Ollama models (no API costs)
# 999 should be effectively unlimited for practical purposes
max_tool_iterations = 999

# Maximum conversation history messages retained per session
# Increased for local models - more context without API costs
max_history_messages = 500

# Enable parallel tool execution within a single iteration
parallel_tools = false

# Tool dispatch strategy: "auto" | "sequential" | "batch"
tool_dispatcher = "auto"

# Compact context mode for smaller models (13B or smaller)
# When true: bootstrap_max_chars=6000, rag_chunk_limit=2
compact_context = false

[server]
# Gateway server configuration
gateway_port = 3000
gateway_host = "127.0.0.1"
allow_public_bind = false

[memory]
# Memory backend configuration
provider = "sqlite"
# db_url = "postgres://localhost/zeroclaw"  # Uncomment for PostgreSQL

[security]
# Security policy configuration
pairing_mode = true
secrets_encrypt = false

[autonomy]
# Autonomy and security policy configuration
level = "supervised"
workspace_only = true
# Allowlist of executable names permitted for shell execution
allowed_commands = ["node", "npm", "echo", "ls", "git", "cat", "pwd", "which"]
# Maximum actions allowed per hour
max_actions_per_hour = 100
# Maximum cost per day in cents (for API providers)
max_cost_per_day_cents = 1000
# Require explicit approval for medium-risk commands
require_approval_for_medium_risk = true
# Block high-risk commands even if allowlisted
block_high_risk_commands = true

[rate_limit]
# Rate limiting configuration
requests_per_minute = 60
