#   2) For each enabled stdio server, spawn child process and perform MCP initialize.
#   3) Dynamically discover tools from each server and register into ZeroClaw tool router.
#   4) Route tool calls by tool name + owning server, not hardcoded server names.
#   5) Add per-server health state, retries, and circuit breaker.
#   6) Preserve graceful degradation: if byterover fails, core agent + SQLite + Mem0 continue.
#
