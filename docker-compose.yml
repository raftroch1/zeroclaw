version: "3.9"

services:
  zeroclaw:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: zeroclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ZEROCLAW_GATEWAY_PORT: 3000
      BRV_PROJECT_ROOT: /zeroclaw-data/workspace
    ports:
      - "3000:3000"
    volumes:
      - zeroclaw-config:/zeroclaw-data/.zeroclaw
      - zeroclaw-workspace:/zeroclaw-data/workspace
      - zeroclaw-data:/zeroclaw-data/state
    depends_on:
      - hermes
    networks:
      - zeroclaw-net

  hermes:
    image: nousresearch/hermes-agent:latest # TODO: pin this to a stable immutable tag once validated in production.
    container_name: hermes
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["hermes", "gateway"]
    command: ["--host", "0.0.0.0", "--port", "8080", "--profile", "lana-sterling"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HERMES_PROFILE: lana-sterling
      HERMES_MODEL: nousresearch/hermes-3-llama-3.1-405b
      HERMES_WORKSPACE: /workspace
      HERMES_HOME: /var/lib/hermes
    ports:
      - "8080:8080"
    volumes:
      - zeroclaw-workspace:/workspace
      - hermes-home:/var/lib/hermes
    networks:
      - zeroclaw-net

volumes:
  zeroclaw-config:
  zeroclaw-workspace:
  zeroclaw-data:
  hermes-home:

networks:
  zeroclaw-net:
    driver: bridge
