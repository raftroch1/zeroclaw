# ZeroClaw production configuration
# Runtime secrets are loaded from environment variables.

workspace_dir = "/zeroclaw-data/workspace"
config_path = "/zeroclaw-data/.zeroclaw/config.toml"
api_key = "${OPENROUTER_API_KEY}"
default_provider = "openrouter"
default_model = "nousresearch/hermes-3-llama-3.1-405b"
default_temperature = 0.4

[observability]
backend = "log"

[autonomy]
level = "full"
workspace_only = true
allowed_commands = [
  "ls", "cat", "grep", "egrep", "fgrep", "head", "tail", "wc", "cut", "sort", "uniq", "tr", "sed", "awk",
  "find", "xargs", "locate", "which", "whereis", "file", "stat", "realpath", "readlink",
  "echo", "printf", "date", "time", "uname", "whoami", "id", "env", "printenv", "pwd", "hostname", "uptime",
  "mkdir", "rmdir", "touch", "cp", "mv", "ln", "chmod", "chgrp", "umask",
  "tar", "zip", "unzip", "gzip", "gunzip", "bzip2", "bunzip2", "xz", "unxz",
  "du", "df", "free", "top", "htop", "ps", "pgrep", "pkill", "kill", "killall",
  "bash", "sh", "dash", "zsh", "fish",
  "python", "python3", "python3.10", "python3.11", "python3.12", "pip", "pip3", "pipx", "virtualenv", "pytest", "ipython",
  "node", "npm", "npx", "yarn", "pnpm", "bun", "deno", "ts-node", "tsc", "eslint", "prettier",
  "go", "gofmt", "goimports", "rustc", "cargo", "clippy", "rustfmt",
  "java", "javac", "mvn", "gradle",
  "git", "gh", "git-lfs",
  "curl", "wget", "http", "jq", "yq",
  "sqlite3", "psql", "mysql", "redis-cli",
  "docker", "docker-compose", "make", "cmake", "ninja",
  "brv", "hermes", "timeout", "watch", "sleep", "tee", "less", "more"
]
forbidden_paths = ["/etc", "/root", "/proc", "/sys", "/dev", "/boot"]
max_actions_per_hour = 5000
max_cost_per_day_cents = 100000
require_approval_for_medium_risk = false
block_high_risk_commands = false
auto_approve = ["shell"]
always_ask = []

[runtime]
kind = "native"

[reliability]
provider_retries = 3
provider_backoff_ms = 500
fallback_providers = []
api_keys = []
channel_initial_backoff_secs = 2
channel_max_backoff_secs = 60
scheduler_poll_secs = 15
scheduler_retries = 2

[scheduler]
enabled = true
max_tasks = 128
max_concurrent = 8

[agent]
compact_context = false
max_tool_iterations = 999
max_history_messages = 100
parallel_tools = true
tool_dispatcher = "auto"

[gateway]
port = 3000
host = "0.0.0.0"
require_pairing = false
allow_public_bind = true
paired_tokens = []
pair_rate_limit_per_minute = 20
webhook_rate_limit_per_minute = 120
trust_forwarded_headers = false
rate_limit_max_keys = 10000
idempotency_ttl_secs = 300
idempotency_max_keys = 10000

[channels_config]
cli = false
message_timeout_secs = 300

[memory]
backend = "sqlite"
auto_save = true
hygiene_enabled = true
archive_after_days = 7
purge_after_days = 30
conversation_retention_days = 30
embedding_provider = "none"
embedding_model = "text-embedding-3-small"
embedding_dimensions = 1536
vector_weight = 0.7
keyword_weight = 0.3
min_relevance_score = 0.4
embedding_cache_size = 10000
chunk_max_tokens = 512
response_cache_enabled = false
response_cache_ttl_minutes = 60
response_cache_max_entries = 5000
snapshot_enabled = false
snapshot_on_hygiene = false
auto_hydrate = true

[storage.provider.config]
provider = ""
schema = "public"
table = "memories"

[identity]
name = "Lana Sterling"
profile = "lana-sterling"
role = "autonomous_research_operator"
style = "precise, production-focused, security-conscious"
mission = "Operate ZeroClaw as Lana Sterling with durable memory, safe autonomy, and deterministic deployment behavior."

[mcp]
enabled = true

[[mcp.servers]]
name = "mem0-brain-surgeon"
transport = "http"
url = "http://mem0-brain-surgeon:3001"
enabled = true
timeout_secs = 30
headers = {}

[[mcp.servers]]
name = "byterover"
enabled = true
transport = "stdio"
command = "brv"
args = ["mcp"]
timeout_secs = 45
env = { BRV_PROJECT_ROOT = "/zeroclaw-data/workspace", BRV_LOG_LEVEL = "info" }

[proxy]
enabled = false
no_proxy = []
scope = "zeroclaw"
services = []
