# API key provided via environment variable (API_KEY)
api_key = ""
default_provider = "anthropic-custom:https://api.z.ai/api/anthropic"
default_model = "glm-5-turbo"
default_temperature = 0.7

# Route vision requests to Gemini 2.0 Flash for multimodal capabilities
model_routes = [
  { hint = "vision", pattern = "^vision|^image|^analyze.*image", provider = "gemini", model = "gemini-2.0-flash-exp" },
  # Route code generation to Z.AI
  { hint = "code", pattern = "^code|^debug|^fix|^implement", provider = "anthropic-custom", model = "glm-5-turbo" },
]

embedding_routes = []

